name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned: the distro package drifts, and a linter that changes under CI
      # turns a green history red for reasons unrelated to any commit.
      - name: install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ
          sudo install -m755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/probes/*.sh

      # The gate exits 2 for "passed what could run". In CI every tool is
      # present, so a missing-tool skip can't happen here — the one skip that
      # can legitimately fire in this environment is the price-table
      # staleness warning, and that one must not turn a green history red on
      # a schedule nobody controls. Exit 1 (an actual failed check) still
      # fails the job; only exit 2 is tolerated.
      #
      # `run:` steps use `bash -e` by default on Linux runners, so a plain
      # multi-line script would abort at the first non-zero exit before the
      # exit-2 tolerance below it ever ran. Keeping the check as the left
      # side of `||` sidesteps that: -e does not trigger on a command that is
      # not the last in an && / || list.
      - name: gate
        run: bash scripts/qa.sh || [ "$?" -eq 2 ]
